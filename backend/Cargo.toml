[package]
name = "creno-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Optional self-hosted ICS relay for the Créno PWA"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
ipnet = "2.12.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
